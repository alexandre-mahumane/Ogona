services:
  db:
    image: postgres:16-alpine
    container_name: ogona-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogona
      POSTGRES_PASSWORD: ogona
      POSTGRES_DB: ogona
    ports:
      - "5432:5432"
    volumes:
      - ogona_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogona -d ogona"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ogona-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ogona_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ogona-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ogona:ogona@db:5432/ogona
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  ogona_pg_data:
  ogona_redis_data:
